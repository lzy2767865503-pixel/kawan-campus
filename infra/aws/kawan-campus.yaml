AWSTemplateFormatVersion: '2010-09-09'
Description: Kawan Campus AWS edge frontend with a private S3 origin and Cloudflare API origin.

Parameters:
  CloudflareOriginDomain:
    Type: String
    Default: kawan-campus.lzy2767865503.workers.dev
    Description: Cloudflare Worker hostname without the https scheme.

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: RemoveIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: RemoveOldNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: Kawan Campus
        - Key: ManagedBy
          Value: CloudFormation

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: Allow only the Kawan Campus CloudFront distribution to read S3.
        Name: !Sub '${AWS::StackName}-s3-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ApiOriginHeaderFunction:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      FunctionCode: !Sub |
        async function handler(event) {
          var request = event.request;
          if (request.headers.origin) {
            request.headers.origin = { value: 'https://${CloudflareOriginDomain}' };
          }
          return request;
        }
      FunctionConfig:
        Comment: Preserve Kawan Campus same-origin write protection behind CloudFront.
        Runtime: cloudfront-js-2.0
      Name: !Sub '${AWS::StackName}-api-origin'

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      FunctionCode: |
        async function handler(event) {
          var request = event.request;
          if (request.method !== 'GET' && request.method !== 'HEAD') {
            return request;
          }
          var finalSegment = request.uri.split('/').pop();
          if (request.uri.endsWith('/')) {
            request.uri += 'index.html';
          } else if (!finalSegment.includes('.')) {
            request.uri = '/index.html';
          }
          return request;
        }
      FunctionConfig:
        Comment: Route extensionless Kawan Campus browser paths to the SPA shell.
        Runtime: cloudfront-js-2.0
      Name: !Sub '${AWS::StackName}-spa-rewrite'

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Comment: Kawan Campus browser security headers.
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Override: true
              Value: camera=(), microphone=(), geolocation=()
        Name: !Sub '${AWS::StackName}-security'
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: >-
              default-src 'self'; base-uri 'self'; connect-src 'self';
              font-src 'self'; form-action 'self'; frame-ancestors 'none';
              img-src 'self' data: blob:; object-src 'none'; script-src 'self';
              style-src 'self' 'unsafe-inline'
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
            Preload: false
          XSSProtection:
            ModeBlock: true
            Override: true
            Protection: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        CacheBehaviors:
          - AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ApiOriginHeaderFunction.FunctionARN
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            PathPattern: api/*
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            TargetOriginId: CloudflareApi
            ViewerProtocolPolicy: redirect-to-https
          - AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            PathPattern: media/*
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            TargetOriginId: CloudflareApi
            ViewerProtocolPolicy: redirect-to-https
        Comment: Kawan Campus UKM production frontend.
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          TargetOriginId: SiteBucket
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt SiteBucket.RegionalDomainName
            Id: SiteBucket
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - CustomOriginConfig:
              HTTPSPort: 443
              OriginKeepaliveTimeout: 5
              OriginProtocolPolicy: https-only
              OriginReadTimeout: 30
              OriginSSLProtocols:
                - TLSv1.2
            DomainName: !Ref CloudflareOriginDomain
            Id: CloudflareApi
        PriceClass: PriceClass_200
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: Kawan Campus
        - Key: ManagedBy
          Value: CloudFormation

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Action:
              - s3:GetObject
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Resource: !Sub '${SiteBucket.Arn}/*'
        Version: '2012-10-17'

Outputs:
  BucketName:
    Description: Private S3 bucket containing the built frontend.
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution ID.
    Value: !Ref Distribution
  ProductionUrl:
    Description: AWS production URL.
    Value: !Sub 'https://${Distribution.DomainName}'
